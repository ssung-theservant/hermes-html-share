<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTML 공유 방법</title><style>body{max-width:44rem;margin:3rem auto;padding:0 1rem;font:1.1rem/1.7 system-ui,sans-serif;color:#243042}code{background:#f2f4f8;padding:.1rem .3rem}</style></head><body><h1>HTML 공유 방법</h1><p>공개해도 되는 HTML 문서 하나를 선택하고, 별도의 영문 주소 이름(slug)을 붙여 배포합니다.</p><p>로컬 프로젝트: <code>~/Sites/hermes-html-share</code></p><p>명령: <code>python3 publish.py /경로/문서.html --slug document-name</code></p><p>배포 확인 후 이 페이지처럼 고유한 링크를 공유할 수 있습니다. 개인정보·API 키가 들어간 문서는 올리지 마세요.</p></body></html>
